<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAFF-P · Painéis</title>
<style>
:root{--navy:#0A2A5E;--blue:#1C5FAD;--yellow:#F2B705;--ink:#14213D;--ink2:#4A5568;--muted:#6A7486;--line:#DDE3EB}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:14px/1.45 "Segoe UI","Avenir Next",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{padding:6px 18px 14px;max-width:1500px;margin:0 auto}
.head{display:flex;align-items:flex-end;gap:14px;margin:0 2px 12px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px}
.head h2::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--yellow)}
.head p{margin:0;color:var(--ink2);font-size:13px}
.head .sp{flex:1}
.live{font-size:12px;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#1E9E5A;box-shadow:0 0 0 3px rgba(30,158,90,.18)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{display:grid;grid-template-columns:42% 1fr;min-height:168px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(10,42,94,.06),0 4px 14px rgba(10,42,94,.07);transition:transform .18s,box-shadow .18s;border-top:4px solid var(--c)}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(10,42,94,.08),0 10px 24px rgba(10,42,94,.12)}
.img{background:#0b1a33 center/cover no-repeat;position:relative}
.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--c) 55%,transparent))}
.ic{position:absolute;left:12px;bottom:12px;z-index:1;width:40px;height:40px;border-radius:10px;background:#fff;color:var(--c);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ic svg{width:22px;height:22px}
.body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.body h3{margin:0;font-size:16px;line-height:1.25;color:var(--ink)}
.body p{margin:0;color:var(--ink2);font-size:13px;flex:1}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;border:0}
.btn:hover{filter:brightness(1.1)}
.btn[aria-disabled="true"]{background:#C9D2DE;color:#4A5568;pointer-events:none}
.old{font-size:12px;color:var(--muted);text-decoration:underline}
.old:hover{color:var(--navy)}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.tag.dev{background:var(--yellow);color:var(--ink)}
@media (max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:1fr}.card{grid-template-columns:36% 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h2>Painéis de acompanhamento</h2>
    <p>Selecione um painel para abrir em uma nova aba.</p>
    <span class="sp"></span>
    <span class="live"><i></i>Dados em Tempo Real</span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const R='https://imagem-govfed.maps.arcgis.com/sharing/rest/content/items/26c68a6e20144b5199923c22b1722c3e/resources/images/';
const EXP='https://experience.arcgis.com/experience/', DSH='https://imagem-govfed.maps.arcgis.com/apps/dashboards/';
const I={
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h6M10 16h6"/>',
  pit:'<path d="M3 17h18M5 17V9l7-4 7 4v8"/><path d="M9 17v-4h6v4"/>',
  fico:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  acid:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  train:'<rect x="6" y="2.5" width="12" height="13" rx="3"/><path d="M6 9.5h12M9.5 5.5h5"/><path d="M9 15.5 6.5 21.5M15 15.5l2.5 6M7.6 19h8.8"/>',
  leaf:'<path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19l7-7"/>'
};
const P=[
  {t:'Autorizações Ferroviárias',d:'Contratos de adesão e requerimentos de autorização ferroviária.',c:'#1C5FAD',i:'train',img:'widget_460/1776101652744.png',url:EXP+'99652a1a4f7a4ee89a8e3c1d6af5d9bb',old:DSH+'b9b84e3d709e4bd9af5e652588ace76e',tag:'Novo painel'},
  {t:'Projeto de Interesse de Terceiros (PIT)',d:'Travessias, paralelismos e interferências de terceiros na faixa ferroviária.',c:'#0F7C80',i:'pit',img:'widget_3/1776101665127.png',url:EXP+'f554b9b22f8e4cfe9470046ad6b45a4a',old:DSH+'8d834b7aae7d4b549e3348f8d133bf55',tag:'Novo painel'},
  {t:'Fiscalização FICO',d:'Obras da Ferrovia de Integração Centro-Oeste, com registros fotográficos.',c:'#1F8A4C',i:'fico',img:'widget_4/1776101680715.png',url:EXP+'20d9b3d0ec0c4383b7834ee8c11c7068',old:DSH+'df0398e7fcea4d9c9919e67bdca24cdd',tag:'Novo painel'},
  {t:'Acidentes Ferroviários',d:'Ocorrências comunicadas pelas concessionárias, por causa, natureza e gravidade.',c:'#B4372B',i:'acid',img:'widget_5/1776101691414.png',url:EXP+'8dcb0c4121d643b6ae0b9e2e304288e8',old:DSH+'56dc12a1126c49acb3bf70559ab33477',tag:'Novo painel'},
  {t:'Malha Sul (RMS)',d:'Acompanhamento da ferrovia concedida à Rumo Malha Sul.',c:'#6A7486',i:'train',img:'background_setting/1783278204299.jpg',url:null,tag:'Em desenvolvimento',dev:true},
  {t:'Painel Ambiental',d:'Demonstrativo de dados ambientais relacionados às concessões ferroviárias.',c:'#7B3FA0',i:'leaf',img:'widget_637/1776173961556.jpg',url:DSH+'7cb56f035ee845f59900881a756dfaa6',tag:'Dashboard'}
];
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
document.getElementById('grid').innerHTML=P.map(p=>`
  <article class="card" style="--c:${p.c}">
    <div class="img" style="background-image:url('${R+p.img}')"><span class="ic">${svg(p.i)}</span></div>
    <div class="body">
      <span class="tag ${p.dev?'dev':''}">${p.tag}</span>
      <h3>${p.t}</h3>
      <p>${p.d}</p>
      <div class="acts">
        ${p.url?`<a class="btn" href="${p.url}" target="_blank" rel="noopener">Abrir painel ↗</a>`:`<span class="btn" aria-disabled="true">Em breve</span>`}
        ${p.old?`<a class="old" href="${p.old}" target="_blank" rel="noopener">versão anterior</a>`:''}
      </div>
    </div>
  </article>`).join('');
</script>
</body>
</html>
