<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acidentes Ferroviários</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<link rel="stylesheet" href="../assets/painel.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://js.arcgis.com/4.30/"></script>
</head>
<body>
<div id="app"></div>
<script>
const dmy=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s||''));return m?+(m[3]+m[2]+m[1]):0;};
const num=v=>(isFinite(+v)&&v!==null&&v!=='')?+v:0;
const median=a=>{const v=a.filter(x=>isFinite(x)&&x!==null).sort((x,y)=>x-y);if(!v.length)return 0;const h=Math.floor(v.length/2);return v.length%2?v[h]:(v[h-1]+v[h])/2;};
const GRAVE={'Sim':'#C2410C','Não':'#1C5FAD'};
window.PAINEL={
  title:'Acidentes Ferroviários',
  subtitle:'Ocorrências comunicadas pelas concessionárias ferroviárias',
  home:'https://experience.arcgis.com/experience/26c68a6e20144b5199923c22b1722c3e',
  theme:{primary:'#B4372B',dark:'#6E1F1A',soft:'#F8E1DD',header:'#7A1F1A'},
  sourceName:'Acidentes Ferroviários',
  layer:'https://services.arcgis.com/4CZwpdWHGNPLU7QQ/arcgis/rest/services/Acidentes_Ferrovi%C3%A1rios/FeatureServer/0',
  oid:'FID',
  normFields:['Grave','Ferrovia','Causa_Dire','Natureza','UF','Município'],
  regionFromUF:'UF',
  derive:r=>{ const m=/(\d{4})\s*$/.exec(String(r.Data_da_Oc||'')); r.ANO=m?m[1]:'Não informado'; r.FER=num(r['Nº_Ferido']); r.OBI=num(r['Nº_Óbito']); },
  filters:[
    {field:'REGIAO',label:'Região',type:'chips',allLabel:'Brasil',order:['Norte','Nordeste','Centro-Oeste','Sudeste','Sul']},
    {field:'ANO',label:'Ano',type:'chips',allLabel:'Todos'},
    {field:'UF',label:'UF',type:'select',allLabel:'Todas'},
    {field:'Ferrovia',label:'Ferrovia',type:'select',allLabel:'Todas'}
  ],
  kpis:[
    {label:'Acidentes',icon:'alert',value:f=>f.length,sub:{label:'Graves',value:f=>f.filter(r=>r.Grave==='Sim').length,color:'#C2410C',textColor:'#9A3412'}},
    {label:'Vítimas feridas',icon:'injury',value:f=>f.reduce((s,r)=>s+r.FER,0),sub:{label:'Acidentes com feridos',value:f=>f.filter(r=>r.FER>0).length}},
    {label:'Óbitos',icon:'ribbon',value:f=>f.reduce((s,r)=>s+r.OBI,0),sub:{label:'Acidentes com óbito',value:f=>f.filter(r=>r.OBI>0).length,color:'#6E1F1A',textColor:'#6E1F1A'}},
    {label:'Comunicação (mediana)',icon:'clock',unit:'h',dec:1,value:f=>median(f.map(r=>+r.Tempo_Comu)),sub:{label:'Interrupção mediana',unit:'h',dec:1,value:f=>median(f.map(r=>+r.Tempo_de_I))}},
    {label:'Ferrovias',icon:'train',value:f=>new Set(f.map(r=>r.Ferrovia).filter(v=>v!=='Não informado')).size,
      sub:{label:'Mais ocorrências',value:f=>{const m={};f.forEach(r=>m[r.Ferrovia]=(m[r.Ferrovia]||0)+1);const t=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return t?`${t[0]} (${t[1].toLocaleString('pt-BR')})`:'—';}}}
  ],
  charts:[
    {slot:'left',type:'donut',title:'Gravidade',field:'Grave',colors:GRAVE,labels:{'Sim':'Grave','Não':'Não grave'},centerLabel:'acidentes'},
    {slot:'left',type:'vbar',title:'Acidentes por ano',field:'ANO',sort:'label',height:220},
    {slot:'right',type:'hbar',title:'Natureza do acidente',field:'Natureza',top:12,height:520,labelWidth:200},
    {slot:'bottom',type:'hbar',title:'Causa direta',field:'Causa_Dire',top:8,height:300,labelWidth:190}
  ],
  map:{title:'Mapa das ocorrências',colorBy:'Grave',colors:GRAVE,labels:{'Sim':'Grave','Não':'Não grave'},legendTitle:'Gravidade',size:6,
    popupTitle:r=>`${r.Natureza} — ${r.Data_da_Oc||''}`,
    popup:r=>`<b>Ferrovia:</b> ${r.Ferrovia}${r.Linha?' · '+r.Linha:''}<br><b>Local:</b> ${r['Município']||'—'}/${r.UF}${r.Km_Inicial!=null?' · km '+r.Km_Inicial:''}<br><b>Grave:</b> ${r.Grave}<br><b>Causa direta:</b> ${r.Causa_Dire}${r.Detalhamen?' ('+r.Detalhamen+')':''}<br><b>Feridos:</b> ${r.FER} · <b>Óbitos:</b> ${r.OBI}<br><b>Interrupção:</b> ${r.Tempo_de_I??'—'} h`},
  table:{title:'Ocorrências',max:400,sort:{f:'Data_da_Oc',dir:-1},columns:[
    {f:'Data_da_Oc',label:'Data',sortGet:r=>dmy(r.Data_da_Oc)},{f:'Ferrovia',label:'Ferrovia'},{f:'UF',label:'UF'},{f:'Município',label:'Município'},
    {f:'Natureza',label:'Natureza'},{f:'Causa_Dire',label:'Causa direta'},{f:'Grave',label:'Grave',color:'Grave'},
    {f:'FER',label:'Feridos',num:true},{f:'OBI',label:'Óbitos',num:true}]}
};
</script>
<script src="../assets/painel.js"></script>
</body>
</html>
